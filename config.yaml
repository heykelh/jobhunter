# ═══════════════════════════════════════════════════════════════════
#  JobHunter — tes critères et tes entreprises
#  Modifie ce fichier directement sur GitHub (icône crayon), puis "Commit".
#  Le prochain passage (toutes les 30 min) prendra les changements en compte.
# ═══════════════════════════════════════════════════════════════════

# Lien de ton site — utilisé dans les notifs
site_url: "https://jobhunter-docs.vercel.app/"

# ─── MOTS-CLÉS ──────────────────────────────────────────────────────
# Le TITRE de l'offre doit contenir au moins un de ces mots.
# Insensible aux majuscules/accents ; "analyst" trouve aussi "analyste".
# Pour en ajouter plus tard : une ligne par mot (ex. "- gouvernance", "- bi", "- daten").
keywords:
  - data
  - analyst

# Titres écartés d'office (seniorité, stages, alternances…)
exclude_title:
  - senior
  - sr
  - lead
  - principal
  - head
  - chief
  - directeur
  - directrice
  - director
  - manager
  - expert
  - experte
  - confirmé
  - confirmée
  - expérimenté
  - expérimentée
  - leader                       # "Team Leader", "Tech Leader"
  - architect
  - architecte
  - coordinateur
  - coordinatrice
  - vice president
  - datacenter                   # "data center" n'a rien à voir avec la data
  - datacenters
  - data center
  - data centre
  - stage
  - stagiaire
  - intern
  - internship
  - trainee
  - alternance
  - alternant
  - alternante
  - apprenti
  - apprentie
  - apprentissage
  - apprenticeship
  - work-study
  - thèse
  - doctorat
  - phd
  - postdoc
  - intérim
  - freelance
  - praktikum
  - praktikant
  - werkstudent
  - lehre

# ─── CONTRAT / EXPÉRIENCE / LIEU ────────────────────────────────────
contracts: [CDI, CDD]
max_experience_years: 2          # écarte les offres qui demandent 3 ans ou plus
# Lecture de l'expérience volontairement stricte :
#  - un champ "Niveau d'expérience : 3 - 5 ans" ou "Confirmé" sur la fiche est prioritaire ;
#  - si la fiche cite plusieurs durées, la plus exigeante compte ;
#  - "solide expérience", "plusieurs années", "several years" = 3 ans ;
#  - un titre contenant "Junior" ou "Jeune diplômé" passe quand même.
# Ensuite l'IA (secret GROQ_API_KEY) relit chaque fiche retenue et doit citer la phrase exacte.
experience_ai: true
experience_ai_per_run: 40        # fiches relues par l'IA au maximum par passage
zones: [ile-de-france, luxembourg, suisse, londres, malaisie, oman]
# Chaque offre est rangée dans une catégorie pays (France, Suisse, Luxembourg, Malaisie, Oman),
# visible en boutons sur le site et en drapeau dans les notifs.

# Réglages propres à un pays (facultatif) : remplacent les réglages généraux ci-dessus.
# Ex. pour accepter jusqu'à 3 ans d'expérience en Suisse, décommente :
country_rules:
  Royaume-Uni:
    # Visa Skilled Worker : salaire minimum de 41 700 £/an (ou plus selon le métier) depuis juillet 2025.
    # Une offre dont le salaire MAXIMUM affiché est plus bas ne peut pas mener à un visa : écartée.
    min_salary: 41700
    currency: GBP
    # true = écarter aussi les employeurs absents du registre officiel des sponsors de visa
    require_sponsor: false
#  Suisse:
#    max_experience_years: 3
#  Oman:
#    contracts: [CDI, CDD]

# Si l'info n'est pas trouvée dans l'offre : keep = on garde (avec "?"), drop = on écarte
unknown_contract: keep
unknown_experience: keep
unknown_location: drop

# ─── NOTIFICATIONS ntfy ─────────────────────────────────────────────
# Le nom du topic se met dans les "Secrets" GitHub (NTFY_TOPIC), pas ici.
notify:
  first_run: false               # pas de rafale de notifs pour le stock déjà en ligne
  max_per_run: 15                # au-delà, une seule notif récapitulative

# ─── CV OPTIMISÉ PAR OFFRE ───────────────────────────────────────────
# Ton CV de référence est dans cv/base_cv.json. La reformulation par IA utilise
# le secret GitHub GROQ_API_KEY (gratuit) ; sans lui, le CV est adapté par règles seules.
cv_enabled: true
cv_per_run: 15                   # CV générés au maximum par passage

# ─── RÉGLAGES TECHNIQUES ────────────────────────────────────────────
time_budget_minutes: 38         # au-delà, le passage s'arrête proprement (reprise au même endroit la fois suivante)
recheck_per_company: 12          # offres déjà affichées revérifiées par passage quand les règles changent
date_backfill_per_company: 10    # offres déjà affichées sans date : fiches rouvertes par passage pour la trouver
delay_seconds: 1.5               # pause entre deux requêtes vers un même site (politesse)
max_details_per_company: 25      # fiches ouvertes par entreprise et par passage
alert_after_failures: 6          # notif "source en panne" après 6 passages ratés (~3 h)

# ═══════════════════════════════════════════════════════════════════
#  ENTREPRISES
#  Pour en ajouter une : copie un bloc, change le nom et l'URL, puis lance
#  le workflow en mode "diagnose" pour vérifier que des offres remontent.
#
#  source: rss   → url d'un flux RSS (le plus fiable)
#  source: json      → url d'une API JSON (offres lues directement)
#  source: workday   → sites Workday : api + public_url (ex. Eiffage)
#  source: sequence  → fiches à numéro croissant lues une à une (ex. EDF / Enedis)
#  source: html  → urls de pages de résultats ; {q} = remplacé par chaque mot-clé
#                  render: true    = ouvrir avec un vrai navigateur (sites en JavaScript)
#                  link_pattern    = morceau d'URL propre aux fiches d'offre (regex)
#                                    sans lui : liens du même site dont le titre contient un mot-clé
#  default_location : zone à utiliser si la fiche ne précise pas le lieu
#  enabled: false   → désactive sans supprimer
# ═══════════════════════════════════════════════════════════════════
companies:

  # ─── Transport ───────────────────────────────────────────────────
  - name: Air France
    source: rss                 # flux officiels CDI + CDD du site recrutement.airfrance.com
    urls:
      - https://recrutement.airfrance.com/handlers/offerRss.ashx?LCID=1036&Rss_Contract=3444
      - https://recrutement.airfrance.com/handlers/offerRss.ashx?LCID=1036&Rss_Contract=3443

  - name: SNCF
    source: html                # les 20 offres les plus récentes (lues dans le JSON de la page)
    urls:
      - https://emploi.sncf.com/nos-offres?page={page}
    pages: [0]
    link_pattern: /nos-offres/\d{5,}$       # les vraies offres ont un n° à 6 chiffres (les petits = catégories)
    url_template: https://emploi.sncf.com/nos-offres/{id}

  - name: RATP Dev
    source: html                # site carrière careers.ratpdev.com
    render: true
    scroll: 3
    urls:
      - https://careers.ratpdev.com/fr/annonces
    link_pattern: /annonce/\d+

  - name: Alstom
    source: html                # site SuccessFactors, offres les plus récentes d'abord
    urls:
      - https://jobsearch.alstom.com/search/?q={q}&sortColumn=referencedate&sortDirection=desc&startrow={offset}
    offsets: [0, 25]
    link_pattern: /job/

  - name: CFL
    source: html
    render: true                  # site Cornerstone (sncfl.csod.com)
    urls:
      - https://sncfl.csod.com/ux/ats/careersite/1/home?c=sncfl
    link_pattern: /requisition/
    url_template: https://sncfl.csod.com/ux/ats/careersite/1/home/requisition/{requisitionId}?c=sncfl
    scroll: 4
    default_location: luxembourg

  - name: SBB CFF FFS
    source: html
    render: true
    urls:
      - https://jobs.sbb.ch/v2/offene-stellen?term={q}
    link_pattern: /offene-stellen/[^/?]+/[0-9a-f-]{36}
    default_location: suisse

  # ─── Banque et assurance ─────────────────────────────────────────
  - name: Société Générale
    source: html                # offres lues dans le JSON de leur moteur de recherche
    render: true
    wait_ms: 6000
    urls:
      - https://careers.societegenerale.com/rechercher?query={q}
      - https://careers.societegenerale.com/
    link_pattern: /offres-d-emploi/
    json_url_pattern: /offres-d-emploi/

  - name: BNP Paribas
    enabled: false              # le site bloque les robots ("Access Denied") — à réactiver si ça change
    source: html
    render: true
    urls:
      - https://group.bnpparibas/emploi-carriere/toutes-offres-emploi/data-analytics?page={page}
    pages: [1, 2, 3, 4, 5]
    link_pattern: /emploi-carriere/offre-emploi/

  - name: Crédit Agricole
    source: html
    render: true
    urls:
      - https://groupecreditagricole.jobs/fr/nos-offres/?keyword={q}
    link_pattern: /nos-offres-emploi/

  - name: BPCE
    source: html
    render: true
    scroll: 4
    wait_ms: 5000
    urls:
      - https://recrutement.bpce.fr/offres-emploi?keywords={q}
    link_pattern: /job/

  - name: AXA
    source: json                # API publique du site carrière AXA, filtrée par pays
    urls:
      - https://jobs.axa.com/api/jobs?keywords={q}&location=France&page={page}&sortBy=posted_date&descending=true
      - https://jobs.axa.com/api/jobs?keywords={q}&location=Luxembourg&page={page}&sortBy=posted_date&descending=true
      - https://jobs.axa.com/api/jobs?keywords={q}&location=Switzerland&page={page}&sortBy=posted_date&descending=true
      - https://jobs.axa.com/api/jobs?keywords={q}&location=United%20Kingdom&page={page}&sortBy=posted_date&descending=true
    pages: [1, 2]
    details: false              # tout est dans l'API (lieu, contrat, date) ; les fiches bloquent les robots

  # ─── Énergie ─────────────────────────────────────────────────────
  - name: EDF / Enedis
    source: sequence            # la liste du site EDF est inaccessible : on lit les nouvelles fiches par numéro
    url_template: https://www.edf.fr/edf-recrute/offre/detail/2026-{n}
    start: 182700               # dernier numéro connu au 23/10/2026 ; mis à jour automatiquement
    max_probe: 80               # fiches lues au maximum par passage
    max_miss: 60
    companies: [Enedis, Framatome, Dalkia, EDF Renouvelables, Cyclife, EDF]

  - name: TotalEnergies
    source: html                # site Avature, 20 offres par page, les plus récentes d'abord
    urls:
      - https://jobs.totalenergies.com/fr_FR/careers/SearchJobs/?jobRecordsPerPage=20&jobOffset={offset}
    offsets: [0, 20, 40, 60, 80, 100, 120, 140, 160, 180]
    link_pattern: /careers/JobDetail/

  # ─── BTP et industrie ────────────────────────────────────────────
  - name: VINCI (dont ETF)
    source: json                # moteur de recherche du site VINCI (la page seule géolocalise le robot en Suède)
    urls:
      - https://jobs.vinci.com/fr/search-jobs/results?ActiveFacetID=0&CurrentPage={page}&RecordsPerPage=50&Distance=50&RadiusUnitType=0&Keywords={q}&Location=&ShowRadius=False&IsPagination=False&SearchResultsModuleName=Search+Results&SearchFiltersModuleName=Search+Filters&SortCriteria=0&SortDirection=0&SearchType=5
    pages: [1, 2]
    link_pattern: /job/

  - name: Eiffage
    source: workday             # API publique Workday du site jobs.eiffage.com
    api: https://eiffage.wd3.myworkdayjobs.com/wday/cxs/eiffage/Eiffage_Careers/jobs
    public_url: https://eiffage.wd3.myworkdayjobs.com/fr-FR/Eiffage_Careers
    offsets: [0, 20]

  - name: Bouygues Telecom
    source: html                # l'ancien site Talentsoft ne répond plus (29/10/2026) ⚠ à confirmer au diagnose
    render: true
    urls:
      - https://www.corporate.bouyguestelecom.fr/travailler-ensemble/

  # ─── Télécoms ────────────────────────────────────────────────────
  - name: Orange
    source: html                # site Phenom : offres lues dans le JSON de la page
    render: true
    wait_ms: 5000
    urls:
      - https://orange.jobs/fr/fr/search-results?keywords={q}

  - name: Vodafone Oman
    enabled: false              # le site refuse les robots ("Request Rejected") ; ses offres passent par GulfTalent
    source: html
    render: true
    urls:
      - https://www.vodafone.om/en/careers
    default_location: oman

  # ─── Sites d'annonces suisses (toutes entreprises) ───────────────
  # aggregator: true → l'entreprise affichée est le vrai employeur, et une annonce déjà vue
  # ailleurs (sur l'autre site ou sur le site de l'entreprise) n'est pas comptée deux fois.
  - name: jobs.ch
    source: html
    aggregator: true
    urls:
      - https://www.jobs.ch/fr/offres-emplois/?term={q}&page={page}
    pages: [1, 2]
    link_pattern: /detail/[0-9a-f-]{36}
    url_template: https://www.jobs.ch/fr/offres-emplois/detail/{id}/
    default_location: suisse
    max_details: 30

  - name: jobup.ch
    source: html                # même plateforme que jobs.ch, surtout Suisse romande
    aggregator: true
    urls:
      - https://www.jobup.ch/fr/emplois/?term={q}&page={page}
    pages: [1, 2]
    link_pattern: /detail/[0-9a-f-]{36}
    url_template: https://www.jobup.ch/fr/emplois/detail/{id}/
    default_location: suisse
    max_details: 30

  # ─── Londres ─────────────────────────────────────────────────────
  - name: Reed (Londres)
    requires_env: REED_API_KEY  # source ignorée tant que la clé n'est pas dans les secrets GitHub
    source: reed                # API officielle gratuite de Reed.co.uk : clé dans le secret GitHub REED_API_KEY
    location: London
    distance_miles: 15
    direct_employers_only: true # sans les cabinets de recrutement (employeur caché = sponsor de visa invérifiable)
    min_salary: 35000           # inutile de lire les offres trop basses pour un visa
    aggregator: true
    max_details: 30

  # ─── Luxe / grande conso ─────────────────────────────────────────
  - name: L'Oréal
    source: html                # site Avature (comme TotalEnergies), chargé en JavaScript
    render: true
    urls:
      - https://careers.loreal.com/fr_FR/jobs/SearchJobs/{q}?jobRecordsPerPage=20&jobOffset={offset}
    offsets: [0, 20]
    link_pattern: /jobs/JobDetail/

  # ─── Banque et assurance : Luxembourg / Suisse ───────────────────
  - name: Julius Baer
    source: workday             # API publique Workday (Zurich, Luxembourg, Genève…)
    api: https://juliusbaer.wd3.myworkdayjobs.com/wday/cxs/juliusbaer/External/jobs
    public_url: https://juliusbaer.wd3.myworkdayjobs.com/en-US/External
    offsets: [0, 20]

  - name: UBS
    source: html                # ⚠ à confirmer : site Brassring, souvent fermé aux robots
    render: true
    wait_ms: 6000
    urls:
      - https://jobs.ubs.com/TGnewUI/Search/Home/Home?partnerid=25008&siteid=5012#keyWordSearch={q}
    link_pattern: jobdetails

  - name: SIX Group
    source: html                # site SuccessFactors (comme Alstom)
    urls:
      - https://jobs.six-group.com/search/?q={q}&sortColumn=referencedate&sortDirection=desc
    link_pattern: /job/
    default_location: suisse

  - name: Advanzia Bank
    source: html
    render: true
    urls:
      - https://www.advanzia.com/en/careers
    link_pattern: /en/job/
    default_location: luxembourg

  - name: ING
    source: html                # site Radancy (comme VINCI) ; lieu lu sur chaque fiche
    render: true
    urls:
      - https://careers.ing.com/en/search-jobs/{q}/3121/1
    link_pattern: /job/

  - name: Swiss Life
    enabled: false              # bloqué par Cloudflare ("Attention Required")
    source: html                # pages carrière CH et FR (offres hébergées sur Workday) ⚠ à confirmer
    render: true
    wait_ms: 6000
    urls:
      - https://www.swisslife.ch/de/ueber-uns/karriere/jobs.html
      - https://www.swisslife.fr/home/carrieres.html
    link_pattern: (myworkdayjobs\.com/.+/job/|/job/)

  # ─── Conseil / IT ────────────────────────────────────────────────
  - name: SII Group
    enabled: false              # l'adresse de recherche n'existe pas ("Page not found") : à remplacer si tu trouves la bonne
    source: html
    render: true
    urls:
      - https://sii-group.com/fr-FR/jobs?search={q}
    link_pattern: /job

  - name: EPAM Systems
    enabled: false              # bloqué par Cloudflare ("Un instant…")
    source: html                # recherche filtrée Malaisie
    render: true
    wait_ms: 6000
    urls:
      - https://www.epam.com/careers/job-listings?query={q}&country=Malaysia
    link_pattern: /careers/job-listings/job\.
    default_location: malaisie

  - name: AIA Digital
    enabled: false              # careers.aia.com n'existe pas ; AIA Malaisie recrute via Hiredly et Maukerja
    source: html                # ⚠ à confirmer : AIA Digital+ (Kuala Lumpur)
    render: true
    urls:
      - https://careers.aia.com/search/?q={q}&locationsearch=Malaysia
    link_pattern: /job/
    default_location: malaisie

  # ─── Oman ────────────────────────────────────────────────────────
  - name: OQ
    enabled: false              # le site coupe la connexion aux robots
    source: html                # ⚠ à confirmer au premier diagnose
    render: true
    urls:
      - https://oq.com/en/careers
    default_location: oman

  - name: Rihal
    enabled: false              # sa page carrières ne liste pas d'offres
    source: html
    render: true
    urls:
      - https://rihal.om/careers
    default_location: oman

  - name: GulfTalent (Oman)
    source: html                # site d'annonces n°1 du Golfe : toutes les offres data/analyst à Oman ⚠ à confirmer
    aggregator: true
    render: true
    urls:
      - https://www.gulftalent.com/oman/jobs/title/{q}
    default_location: oman

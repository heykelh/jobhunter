# ═══════════════════════════════════════════════════════════════════
#  JobHunter — sites d'emploi (France, Suisse, Luxembourg)
#  Mêmes critères que config.yaml (mots-clés, contrats, expérience, zones, allemand…) :
#  ce fichier ne précise que les sources. Une offre déjà présente dans la liste
#  « Sites carrière » n'est pas ajoutée une deuxième fois.
#  Page du site : onglet « Sites d'emploi » · workflow GitHub : JobHunter sites d'emploi
#
#  aggregator: true → l'entreprise affichée est le vrai employeur, et une annonce déjà vue
#  ailleurs (autre site d'emploi ou site de l'entreprise) n'est pas comptée deux fois.
# ═══════════════════════════════════════════════════════════════════
extends: config.yaml

# Ces sites renvoient beaucoup d'offres : fiches lues par source et par passage
max_details_per_company: 40
experience_ai_per_run: 50

companies:

  # ─── France ──────────────────────────────────────────────────────
  - name: APEC
    enabled: false              # protégé par l'anti-robot DataDome : la page reste vide pour le robot GitHub (14/11/2026)
    source: html
    aggregator: true
    render: true
    wait_ms: 6000
    urls:
      - https://www.apec.fr/candidat/recherche-emploi.html/emploi?motsCles={q}&lieux=711&sortsType=DATE
    link_pattern: /detail-offre/
    url_template: https://www.apec.fr/candidat/recherche-emploi.html/emploi/detail-offre/{numeroOffre}
    render_detail: true
    default_location: ile-de-france

  - name: France Travail
    enabled: false              # à activer (true) une fois les secrets FT_CLIENT_ID et FT_CLIENT_SECRET ajoutés sur GitHub
    source: francetravail       # API officielle et gratuite : offres France Travail + sites partenaires, description complète
    aggregator: true
    contracts: [CDI, CDD]
    published_within_days: 14
    params:
      region: "11"              # Île-de-France

  - name: HelloWork
    source: html                # chaque fiche contient ses données structurées (employeur, lieu, contrat, date)
    aggregator: true
    urls:
      - https://www.hellowork.com/fr-fr/emploi/recherche.html?k={q}&l=%C3%8Ele-de-France&c=CDI&c=CDD&p={page}
    pages: [1, 2]
    link_pattern: /fr-fr/emplois/\d+\.html

  - name: HelloWork (Transavia, RATP, ADP)
    source: html                # toutes les annonces de ces employeurs sur HelloWork (Transavia France n'a pas de site
    aggregator: true            #  carrière public : ses offres passent par les sites d'emploi) ; mots-clés vérifiés sur l'intitulé
    urls:
      - https://www.hellowork.com/fr-fr/emploi/recherche.html?k=Transavia&c=CDI&c=CDD&p={page}
      - https://www.hellowork.com/fr-fr/emploi/recherche.html?k=RATP&l=%C3%8Ele-de-France&c=CDI&c=CDD&p={page}
      - https://www.hellowork.com/fr-fr/emploi/recherche.html?k=Groupe+ADP&c=CDI&c=CDD&p={page}
    pages: [1, 2]
    link_pattern: /fr-fr/emplois/\d+\.html

  # ─── Suisse ──────────────────────────────────────────────────────
  - name: jobs.ch
    source: html                # n°1 en Suisse
    aggregator: true
    urls:
      - https://www.jobs.ch/fr/offres-emplois/?term={q}&page={page}
    pages: [1, 2]
    link_pattern: /detail/[0-9a-f-]{36}
    url_template: https://www.jobs.ch/fr/offres-emplois/detail/{id}/
    default_location: suisse
    max_details: 30

  - name: jobup.ch
    source: html                # même plateforme que jobs.ch, surtout Suisse romande
    aggregator: true
    urls:
      - https://www.jobup.ch/fr/emplois/?term={q}&page={page}
    pages: [1, 2]
    link_pattern: /detail/[0-9a-f-]{36}
    url_template: https://www.jobup.ch/fr/emplois/detail/{id}/
    default_location: suisse
    max_details: 30

  # ─── Luxembourg ──────────────────────────────────────────────────
  - name: Moovijob (Luxembourg)
    source: html                # n°1 au Luxembourg : banques, Big Four, IT…
    aggregator: true
    render: true
    urls:
      - https://www.moovijob.com/offres-emploi/jobs-luxembourg/metier-data-analyst
      - https://www.moovijob.com/offres-emploi/jobs-luxembourg/metier-business-analyst
      - https://www.moovijob.com/offres-emploi/jobs-luxembourg/metier-data-scientist
      - https://www.moovijob.com/offres-emploi/jobs-luxembourg/metier-data-engineer
    link_pattern: moovijob\.com/offres-emploi/(?!jobs-luxembourg)[a-z0-9-]+/[a-z0-9-]+/?$
    default_location: luxembourg
    max_details: 30

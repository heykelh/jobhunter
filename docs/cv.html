<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV optimisé · JobHunter</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3a5'/%3E%3Cstop offset='1' stop-color='%230e7a64'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='5'%3E%3Ccircle cx='32' cy='32' r='19'/%3E%3Ccircle cx='32' cy='32' r='9'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='2.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="kanit.css">
<style>
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --ink: #1b1d1f; --muted: #6b6f75; --line: #e3e1db;
    --accent: #0e7a64; --accent-soft: #e2f1ed; --warn: #a16207; --warn-soft: #fdf6dc; --bad: #b91c1c;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body, button, input, select, textarea { font-family: "Kanit", ui-sans-serif, system-ui, sans-serif; }
  body { margin: 0; background: #eef1f5; color: var(--ink); font-size: 14px; line-height: 1.45; }
  .top { position: sticky; top: 0; z-index: 5; color: #eef3f1;
         background: linear-gradient(180deg, #0f1c2e, #142640); }
  .top .in { max-width: 1400px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .top a.back { color: #8ea2bf; text-decoration: none; }
  .top a.back:hover { color: #fff; }
  .top h1 { font-size: 17px; font-weight: 500; margin: 0; flex: 1 1 260px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn { font-size: 13.5px; padding: 8px 13px; border-radius: 11px; border: 1px solid var(--line);
         background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; }
  .top .btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.12); color: #eef3f1; }
  .top .btn:hover { background: rgba(255,255,255,.14); }
  .btn.primary, .top .btn.primary { background: #f5b83d; color: #1d1300; border-color: #f5b83d; font-weight: 500; }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 20px; align-items: start; }
  @media (max-width: 1000px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px;
           box-shadow: 0 1px 2px rgba(16,24,22,.05), 0 8px 24px rgba(16,24,22,.06); }
  .panel h2 { font-size: 12.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); margin: 0 0 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  input[type=text], textarea, select { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px;
         border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  textarea { resize: vertical; min-height: 60px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .card.off { opacity: .5; }
  .card-h { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .card-h .grow { flex: 1; font-weight: 600; min-width: 140px; }
  .hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .meta { font-size: 12px; color: var(--muted); }
  .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  /* Aperçu : page A4 à l'échelle */
  .preview-box { position: sticky; top: 70px; }
  .scaler { width: 100%; overflow: hidden; border-radius: 6px; box-shadow: 0 2px 16px rgba(0,0,0,.12); background: #fff; }
  .page { width: 794px; min-height: 1123px; padding: 45px 53px; background: #fff; color: #111; transform-origin: top left;
          font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; position: relative; }
  .page .pb { position: absolute; left: 0; right: 0; top: 1123px; border-top: 2px dashed #d33; }
  .page .pb span { position: absolute; right: 8px; top: 2px; font: 11px Arial; color: #d33; }
  .p-name { text-align: center; font-weight: 700; color: #1F3864; }
  .p-title { text-align: center; font-weight: 700; color: #2E75B6; margin-top: 1px; }
  .p-contact { text-align: center; color: #333; margin: 3px 0 5px; }
  .p-contact a { color: #2E75B6; text-decoration: none; }
  .p-sec { text-transform: uppercase; font-weight: 700; color: #1F3864; border-bottom: 1px solid #1F3864; margin: 12px 0 4px; padding-bottom: 1px; }
  .p-just { text-align: justify; }
  .p-line { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; }
  .p-line .r { color: #555; white-space: nowrap; }
  .p-line a, .page a { color: #2E75B6; text-decoration: none; }
  .p-stack { font-style: italic; color: #555; }
  .page ul { margin: 1px 0 2px; padding-left: 18px; }
  .page li { margin: 0 0 1px; }
  .fit { margin-top: 8px; font-size: 13px; }
  .fit.ok { color: var(--accent); } .fit.over { color: var(--bad); font-weight: 600; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="back" href="./">← Offres</a>
  <h1 id="h">CV optimisé</h1>
  <a class="btn" id="offer" target="_blank" rel="noopener">Voir l'offre</a>
  <button class="btn" id="reset" title="Revenir au CV généré pour cette offre">Réinitialiser</button>
  <button class="btn" id="pdf">Télécharger en PDF</button>
  <button class="btn primary" id="dl">Télécharger en Word</button>
</div></div>

<div class="wrap">
  <div id="form"><div class="empty">Chargement…</div></div>
  <div class="preview-box">
    <div class="scaler" id="scaler"><div class="page" id="page"></div></div>
    <div class="fit" id="fit"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js"></script>
<script src="cv-docx.js"></script>
<script src="cv-pdf.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const id = new URLSearchParams(location.search).get("id") || "";
const KEY = "jh-cv-" + id;
let BASE = null, GEN = null, JOB = null, cv = null;

async function getJSON(u) { try { const r = await fetch(u + "?t=" + Date.now()); return r.ok ? r.json() : null; } catch { return null; } }

// Assemble un CV complet : partie adaptée à l'offre + parties fixes du CV de base + coordonnées mémorisées
function compose() {
  const b = BASE || {};
  const g = GEN || {};
  const contact = { ...(b.contact || {}), ...ls.get("jh-contact", {}) };
  return {
    nom: b.nom || "", contact, titre: g.titre || (JOB ? JOB.title : ""), profil: g.profil || "",
    competences: JSON.parse(JSON.stringify(g.competences || b.competences || [])),
    projets: JSON.parse(JSON.stringify(g.projets || (b.projets || []).slice(0, 4))).map(p => ({ ...p, inclus: true })),
    experiences: JSON.parse(JSON.stringify(b.experiences || [])),
    formations: JSON.parse(JSON.stringify(b.formations || [])),
    langues: b.langues || "", atouts: b.atouts || "",
    entreprise: g.entreprise || (JOB ? JOB.company : ""), taille: 10, espacement: 1,
  };
}

function save() { ls.set(KEY, cv); ls.set("jh-contact", cv.contact); preview(); }

// ------------------------------------------------------------------ formulaire
function field(label, path, opts = {}) {
  const val = get(path);
  const tag = opts.area
    ? `<textarea data-p="${path}" rows="${opts.rows || 3}">${esc(Array.isArray(val) ? val.join("\n") : val)}</textarea>`
    : `<input type="text" data-p="${path}" value="${esc(val)}">`;
  return `<div><label>${label}</label>${tag}${opts.hint ? `<div class="hint">${opts.hint}</div>` : ""}</div>`;
}
function get(path) { return path.split(".").reduce((o, k) => (o == null ? o : o[k]), cv) ?? ""; }
function set(path, value) {
  const ks = path.split("."); let o = cv;
  for (const k of ks.slice(0, -1)) o = o[k];
  const last = ks[ks.length - 1];
  o[last] = Array.isArray(o[last]) ? value.split("\n").map(s => s.trim()).filter(Boolean) : value;
}

function cardHead(kind, i, item) {
  return `<div class="card-h">
      <label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--ink)"><input type="checkbox" data-act="${kind}inc" data-i="${i}" ${item.inclus === false ? "" : "checked"}> Inclure</label>
      <span class="grow"></span>
      <button class="btn small" data-act="${kind}move" data-i="${i}" data-d="-1" aria-label="Monter">↑</button>
      <button class="btn small" data-act="${kind}move" data-i="${i}" data-d="1" aria-label="Descendre">↓</button>
      <button class="btn small" data-act="${kind}del" data-i="${i}">Supprimer</button></div>`;
}

function render() {
  const g = GEN || {};
  const missing = g.mots_cles_manquants || [];
  const notIn = (BASE?.projets || []).filter(p => !cv.projets.some(q => q.id === p.id));
  $("#form").innerHTML = `
  <div class="panel">
    <h2>Offre</h2>
    <div><b>${esc(JOB?.title || g.intitule_offre || "Offre")}</b> · ${esc(JOB?.company || g.entreprise || "")}</div>
    <div class="meta">${GEN ? `CV adapté le ${new Date(g.genere_le).toLocaleString("fr-FR")} (${esc(g.methode || "")})` : "Pas encore de CV généré pour cette offre : version de base affichée."}</div>
    ${missing.length ? `<div class="hint" style="margin-top:8px">Mots de l'offre absents de ton CV. N'ajoute que ce que tu sais défendre en entretien :</div><div class="chips">${missing.map(m => `<span class="chip">${esc(m)}</span>`).join("")}</div>` : ""}
  </div>

  <div class="panel">
    <h2>En-tête</h2>
    <div class="row">${field("Nom", "nom")}${field("Titre du CV", "titre")}</div>
    <div class="row">${field("Ville", "contact.ville")}${field("Téléphone", "contact.telephone")}${field("Email", "contact.email")}</div>
    <div class="row">${field("Portfolio", "contact.portfolio")}${field("GitHub", "contact.github")}${field("LinkedIn", "contact.linkedin")}</div>
    <div class="hint">Les coordonnées sont mémorisées sur cet appareil pour tous tes CV.</div>
  </div>

  <div class="panel"><h2>Profil</h2>${field("Texte", "profil", { area: true, rows: 5 })}</div>

  <div class="panel"><h2>Compétences</h2>
    ${cv.competences.map((c, i) => `<div class="card">
      <div class="card-h"><span class="grow">${esc(c.groupe)}</span>
        <button class="btn small" data-act="cmove" data-i="${i}" data-d="-1">↑</button>
        <button class="btn small" data-act="cmove" data-i="${i}" data-d="1">↓</button>
        <button class="btn small" data-act="cdel" data-i="${i}">Retirer</button></div>
      ${field("Intitulé", `competences.${i}.groupe`)}
      ${field("Éléments (un par ligne)", `competences.${i}.items`, { area: true, rows: 3 })}
    </div>`).join("")}
    <button class="btn small" data-act="cadd">+ Groupe de compétences</button>
  </div>

  <div class="panel"><h2>Projets</h2>
    ${cv.projets.map((p, i) => `<div class="card ${p.inclus === false ? "off" : ""}">
      <div class="card-h">
        <label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--ink)"><input type="checkbox" data-act="pinc" data-i="${i}" ${p.inclus === false ? "" : "checked"}> Inclure</label>
        <span class="grow"></span>
        <button class="btn small" data-act="pmove" data-i="${i}" data-d="-1">↑</button>
        <button class="btn small" data-act="pmove" data-i="${i}" data-d="1">↓</button>
        <button class="btn small" data-act="pdel" data-i="${i}">Supprimer</button></div>
      <div class="row">${field("Titre", `projets.${i}.titre`)}${field("Date (à droite)", `projets.${i}.dates`)}</div>
      <div class="row">${field("Lien (sous le titre)", `projets.${i}.lien`)}${field("Technologies", `projets.${i}.stack`)}</div>
      ${field("Puces (une par ligne)", `projets.${i}.puces`, { area: true, rows: 3 })}
    </div>`).join("")}
    <div class="row" style="align-items:end">
      <div><label>Ajouter un projet de ton portfolio</label><select id="addp"><option value="">Choisir…</option>${notIn.map(p => `<option value="${esc(p.id)}">${esc(p.titre)}</option>`).join("")}</select></div>
      <div><button class="btn small" data-act="padd">+ Ajouter</button> <button class="btn small" data-act="pnew">+ Projet vide</button></div>
    </div>
  </div>

  <div class="panel"><h2>Expérience</h2>
    ${cv.experiences.map((e, i) => `<div class="card ${e.inclus === false ? "off" : ""}">
      ${cardHead("e", i, e)}
      <div class="row">${field("Poste", `experiences.${i}.titre`)}${field("Entreprise", `experiences.${i}.entreprise`)}${field("Dates", `experiences.${i}.dates`)}</div>
      ${field("Puces (une par ligne)", `experiences.${i}.puces`, { area: true, rows: 4 })}
    </div>`).join("")}
    <button class="btn small" data-act="enew">+ Ajouter une expérience</button>
  </div>

  <div class="panel"><h2>Formation</h2>
    ${cv.formations.map((f, i) => `<div class="card ${f.inclus === false ? "off" : ""}">
      ${cardHead("f", i, f)}
      <div class="row">${field("Diplôme", `formations.${i}.titre`)}${field("École", `formations.${i}.ecole`)}${field("Dates", `formations.${i}.dates`)}</div>
    </div>`).join("")}
    <button class="btn small" data-act="fnew">+ Ajouter une formation</button>
  </div>

  <div class="panel"><h2>Langues et atouts</h2>
    ${field("Langues", "langues", { area: true, rows: 2 })}${field("Atouts", "atouts", { area: true, rows: 2 })}
  </div>

  <div class="panel"><h2>Mise en page</h2>
    <div class="sliders">
      <div><label>Taille du texte : <b id="tz">${cv.taille}</b> pt</label><input type="range" min="8.5" max="11.5" step="0.5" data-r="taille" value="${cv.taille}"></div>
      <div><label>Espacement : <b id="es">${cv.espacement}</b></label><input type="range" min="0.5" max="1.5" step="0.1" data-r="espacement" value="${cv.espacement}"></div>
    </div>
    <div class="hint">Réduis la taille ou l'espacement si l'aperçu dépasse la ligne rouge de fin de page.</div>
  </div>`;
}

// ------------------------------------------------------------------ aperçu
function preview() {
  const pt = Number(cv.taille) || 10, k = 96 / 72, gap = Number(cv.espacement) || 1;
  const fs = v => `font-size:${(v * k).toFixed(2)}px`;
  const c = cv.contact || {};
  const contacts = [c.ville, c.telephone].filter(Boolean).map(esc)
    .concat(["email", "portfolio", "github", "linkedin"].filter(x => c[x]).map(x => `<a>${esc(c[x])}</a>`));
  const ul = arr => (arr || []).filter(x => String(x).trim()).length
    ? `<ul>${arr.filter(x => String(x).trim()).map(x => `<li>${esc(CvDocx.clean(x))}</li>`).join("")}</ul>` : "";
  const sec = t => `<div class="p-sec" style="${fs(pt + 1)};margin-top:${12 * gap}px">${t}</div>`;
  const projets = cv.projets.filter(p => p.inclus !== false);
  const exps = (cv.experiences || []).filter(x => x.inclus !== false);
  const forms = (cv.formations || []).filter(x => x.inclus !== false);
  const href = u => /^https?:\/\//.test(u) ? u : "https://" + u;
  $("#page").innerHTML = `
    <div class="p-name" style="${fs(pt + 9)}">${esc(cv.nom)}</div>
    ${cv.titre ? `<div class="p-title" style="${fs(pt + 3)}">${esc(CvDocx.clean(cv.titre))}</div>` : ""}
    <div class="p-contact" style="${fs(pt - 0.5)}">${contacts.join(" &nbsp;|&nbsp; ")}</div>
    <div style="${fs(pt)};line-height:1.2">
    ${cv.profil ? sec("Profil") + `<div class="p-just">${esc(CvDocx.clean(cv.profil))}</div>` : ""}
    ${cv.competences.some(g => g.items.length) ? sec("Compétences") + cv.competences.filter(g => g.items.length).map(g => `<div style="margin-bottom:${2 * gap}px"><b>${esc(g.groupe)} :</b> ${esc(g.items.join(", "))}</div>`).join("") : ""}
    ${projets.length ? sec("Projets data (portfolio)") + projets.map(p => `
      <div class="p-line" style="margin-top:${4 * gap}px"><b>${esc(CvDocx.clean(p.titre))}</b>${p.dates ? `<span class="r" style="${fs(pt - 0.5)}">${esc(p.dates)}</span>` : ""}</div>
      ${p.lien ? `<div style="${fs(pt - 0.5)}"><a href="${esc(href(p.lien))}" target="_blank" rel="noopener">${esc(p.lien)}</a></div>` : ""}
      ${p.stack ? `<div class="p-stack" style="${fs(pt - 0.5)}">${esc(p.stack)}</div>` : ""}${ul(p.puces)}`).join("") : ""}
    ${exps.length ? sec("Expérience professionnelle") + exps.map(e => `
      <div class="p-line" style="margin-top:${4 * gap}px"><span><b>${esc(e.titre)}</b>${e.entreprise ? ", " + esc(e.entreprise) : ""}</span><span class="r" style="${fs(pt - 0.5)}">${esc(e.dates)}</span></div>${ul(e.puces)}`).join("") : ""}
    ${forms.length ? sec("Formation") + forms.map(f => `
      <div class="p-line" style="margin-top:${3 * gap}px"><span><b>${esc(f.titre)}</b>${f.ecole ? ", " + esc(f.ecole) : ""}</span><span class="r" style="${fs(pt - 0.5)}">${esc(f.dates)}</span></div>`).join("") : ""}
    ${(cv.langues || cv.atouts) ? sec("Langues et atouts") + [cv.langues, cv.atouts].filter(Boolean).map(x => `<div>${esc(x)}</div>`).join("") : ""}
    </div>
    <div class="pb"><span>fin de la page 1</span></div>`;
  fitScale();
  const h = $("#page").scrollHeight;
  const over = h > 1123 + 4;
  $("#fit").className = "fit " + (over ? "over" : "ok");
  $("#fit").textContent = over ? "L'aperçu dépasse une page : réduis le texte, l'espacement ou retire une puce." : "Tient sur une page (aperçu approximatif ; le fichier Word fait foi).";
}
function fitScale() {
  const w = $("#scaler").clientWidth, s = Math.min(1, w / 794);
  const pg = $("#page");
  pg.style.transform = `scale(${s})`;
  $("#scaler").style.height = (Math.max(1123, pg.scrollHeight) + 30) * s + "px";
}

// ------------------------------------------------------------------ événements
document.addEventListener("input", e => {
  const p = e.target.dataset.p;
  if (p) { set(p, e.target.value); save(); return; }
  const r = e.target.dataset.r;
  if (r) { cv[r] = Number(e.target.value); $(r === "taille" ? "#tz" : "#es").textContent = e.target.value; save(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const i = Number(b.dataset.i), d = Number(b.dataset.d), act = b.dataset.act;
  const move = (arr) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
  if (act === "pinc") { cv.projets[i].inclus = b.checked; }
  else if (act === "pmove") move(cv.projets);
  else if (act === "pdel") cv.projets.splice(i, 1);
  else if (act === "padd") {
    const pid = $("#addp").value; const p = (BASE?.projets || []).find(x => x.id === pid);
    if (p) cv.projets.push({ ...JSON.parse(JSON.stringify(p)), inclus: true });
  }
  else if (act === "pnew") cv.projets.push({ id: "perso-" + Date.now(), titre: "Nouveau projet", stack: "", lien: "", puces: [], inclus: true });
  else if (act === "einc") cv.experiences[i].inclus = b.checked;
  else if (act === "emove") move(cv.experiences);
  else if (act === "edel") cv.experiences.splice(i, 1);
  else if (act === "enew") cv.experiences.push({ titre: "Nouveau poste", entreprise: "", dates: "", puces: [], inclus: true });
  else if (act === "finc") cv.formations[i].inclus = b.checked;
  else if (act === "fmove") move(cv.formations);
  else if (act === "fdel") cv.formations.splice(i, 1);
  else if (act === "fnew") cv.formations.push({ titre: "Nouvelle formation", ecole: "", dates: "", inclus: true });
  else if (act === "cmove") move(cv.competences);
  else if (act === "cdel") cv.competences.splice(i, 1);
  else if (act === "cadd") cv.competences.push({ groupe: "Autres", items: [] });
  else return;
  save(); render();
});
$("#reset").addEventListener("click", () => {
  if (!confirmReset()) return;
  ls.del(KEY); cv = compose(); render(); preview();
});
function confirmReset() { // pas de boîte de dialogue bloquante : double clic en 3 s
  const btn = $("#reset");
  if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = "Réinitialiser"; return true; }
  btn.dataset.armed = "1"; btn.textContent = "Confirmer ?";
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = "Réinitialiser"; }, 3000);
  return false;
}
$("#dl").addEventListener("click", async () => {
  const btn = $("#dl"); btn.disabled = true; btn.textContent = "Création…";
  try {
    const doc = CvDocx.buildDocument(cv, window.docx);
    const blob = await window.docx.Packer.toBlob(doc);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = CvDocx.fileName(cv);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (err) {
    console.error(err); btn.textContent = "Erreur, réessaie"; setTimeout(() => btn.textContent = "Télécharger en Word", 2500);
  } finally { btn.disabled = false; if (btn.textContent === "Création…") btn.textContent = "Télécharger en Word"; }
});
$("#pdf").addEventListener("click", () => {
  const btn = $("#pdf");
  try {
    window.pdfMake.createPdf(CvPdf.buildDefinition(cv)).download(CvDocx.fileName(cv).replace(/\.docx$/, ".pdf"));
  } catch (err) {
    console.error(err); btn.textContent = "Erreur, réessaie"; setTimeout(() => btn.textContent = "Télécharger en PDF", 2500);
  }
});
window.addEventListener("resize", fitScale);

(async function init() {
  const [base, gen, jobs] = await Promise.all([getJSON("data/cv/base.json"), id ? getJSON(`data/cv/${id}.json`) : null, getJSON("data/jobs.json"), getJSON("data/boards/jobs.json")]).then(([b, g, j1, j2]) => [b, g, { jobs: [...((j1 && j1.jobs) || []), ...((j2 && j2.jobs) || [])] }]);
  BASE = base; GEN = gen; JOB = (jobs?.jobs || []).find(j => j.id === id) || null;
  if (new URLSearchParams(location.search).get("p") === "boards") document.querySelector("a.back").href = "./?p=boards";
  if (!BASE) { $("#form").innerHTML = `<div class="empty">CV de base introuvable. Lance un passage du robot (mode run) pour publier cv/base_cv.json.</div>`; return; }
  $("#h").textContent = "CV · " + (JOB ? `${JOB.company} · ${JOB.title}` : (GEN?.intitule_offre || "CV de base"));
  const url = JOB?.url || GEN?.url_offre; if (url) $("#offer").href = url; else $("#offer").style.display = "none";
  cv = ls.get(KEY, null) || compose();
  cv.contact = { ...(cv.contact || {}), ...ls.get("jh-contact", {}) };
  render(); preview();
})();
</script>

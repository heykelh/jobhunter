# ═══════════════════════════════════════════════════════════════════
#  JobHunter — plateformes Workday et SmartRecruiters
#  Mêmes critères que config.yaml (mots-clés, contrats, expérience, zones, allemand…).
#  Ni Workday ni SmartRecruiters n'ont de recherche commune à toutes les entreprises :
#  le robot interroge l'API publique de chaque entreprise de la liste ci-dessous.
#  Une offre déjà présente dans une autre liste n'est pas ajoutée une deuxième fois.
#  Page du site : onglet « Workday · SmartRecruiters » · workflow GitHub : JobHunter Workday SmartRecruiters
#
#  Ajouter une entreprise :
#   - Workday : l'adresse d'une offre ressemble à https://<hôte>.myworkdayjobs.com/<langue>/<site>/job/…
#       api: https://<hôte>.myworkdayjobs.com/wday/cxs/<tenant>/<site>/jobs   (tenant = début de l'hôte)
#       public_url: https://<hôte>.myworkdayjobs.com/<site>
#   - SmartRecruiters : l'adresse d'une offre ressemble à https://jobs.smartrecruiters.com/<identifiant>/<numéro>
#       company_id: <identifiant>   countries: [fr, ch, lu]
# ═══════════════════════════════════════════════════════════════════
extends: config.yaml

max_details_per_company: 15     # fiches ouvertes par entreprise et par passage (les offres hors France/Suisse/Luxembourg
                                #  sont déjà filtrées par Workday et SmartRecruiters)
experience_ai_per_run: 50

# Recherches envoyées à Workday (les mots courts "ai" / "ia" ramènent trop d'offres sans rapport)
ats_search_terms: &terms [data, analyst, analyste, pricing, revenue management]

# Workday limite fort le nombre de requêtes : un passage complet peut demander deux lancements,
# le suivant reprend là où le précédent s'est arrêté.
time_budget_minutes: 45

companies:

  # ─── SmartRecruiters (rapide : toutes les offres des pays suivis, triées par mots-clés) ──
